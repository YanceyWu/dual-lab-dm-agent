[tool.poetry]
name = "ai-pm-agent"
version = "0.1.0"
description = "Local-first Delivery Manager toolkit for portable delivery workflows"
authors = ["PM Example <pm@example.invalid>"]
readme = "README.md"
packages = [
    { include = "pm_agent" },
]
include = [
    { path = "pm_agent/dashboard/web/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.12"
click = ">=8.1,<8.2"
rich = "^13.7"
pydantic = "^2.7"
pydantic-settings = "^2.3"
httpx = "^0.27"
python-dotenv = "^1.0"
flask = "^3.0"
requests = "^2.32"
openpyxl = "^3.1"
pyyaml = "^6.0"
beautifulsoup4 = "^4.12"
markdownify = "^0.12"
playwright = "^1.46"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.4"

[tool.poetry.scripts]
pm = "pm_agent.cli.app:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
